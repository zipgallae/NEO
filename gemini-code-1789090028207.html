<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA 소행성 정보 조회기</title>
    <style>
        :root {
            --bg-color: #0b0d17;
            --card-bg: #151932;
            --accent-color: #00d2ff;
            --text-color: #ffffff;
            --text-muted: #a0a5c0;
            --danger-color: #ff4757;
            --safe-color: #2ed573;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 20px;
            text-align: center;
        }

        .search-box {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 30px;
        }

        input[type="date"] {
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid var(--accent-color);
            background-color: #0b0d17;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }

        button {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0099cc;
            color: #fff;
        }

        #status {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: var(--text-muted);
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            border-left: 5px solid var(--safe-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card.hazardous {
            border-left-color: var(--danger-color);
        }

        .card h3 {
            margin-top: 0;
            color: var(--accent-color);
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .badge.safe {
            background-color: rgba(46, 213, 115, 0.2);
            color: var(--safe-color);
        }

        .badge.danger {
            background-color: rgba(255, 71, 87, 0.2);
            color: var(--danger-color);
        }

        .info-item {
            margin: 8px 0;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .info-item strong {
            color: var(--text-color);
        }
    </style>
</head>
<body>

    <h1>🌌 NASA 근지구 소행성(NEO) 탐색기</h1>

    <div class="search-box">
        <label for="search-date">날짜 선택:</label>
        <input type="date" id="search-date">
        <button onclick="fetchAsteroids()">조회하기</button>
    </div>

    <div id="status">날짜를 선택하고 조회 버튼을 누르세요.</div>
    <div id="results" class="results-grid"></div>

    <script>
        const API_KEY = '2NiVm7zAh0oIv1JWPlmD0KZbEYKqyeeZlaEBwqx6';

        // 오늘 날짜를 기본값으로 설정
        document.getElementById('search-date').valueAsDate = new Date();

        async function fetchAsteroids() {
            const dateInput = document.getElementById('search-date').value;
            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');

            if (!dateInput) {
                alert('날짜를 선택해 주세요.');
                return;
            }

            statusDiv.textContent = 'NASA 데이터를 불러오는 중...';
            resultsDiv.innerHTML = '';

            const url = `https://api.nasa.gov/neo/rest/v1/feed?start_date=${dateInput}&end_date=${dateInput}&api_key=${API_KEY}`;

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`오류 발생: ${response.status}`);
                }

                const data = await response.parse ? await response.json() : await response.json();
                const asteroids = data.near_earth_objects[dateInput];

                if (!asteroids || asteroids.length === 0) {
                    statusDiv.textContent = '해당 날짜에 접근하는 소행성 데이터가 없습니다.';
                    return;
                }

                statusDiv.textContent = `총 ${asteroids.length}개의 소행성이 지구 근처를 지나갑니다.`;

                asteroids.forEach(asteroid => {
                    const isHazardous = asteroid.is_potentially_hazardous_asteroid;
                    const minDiameter = Math.round(asteroid.estimated_diameter.meters.estimated_diameter_min);
                    const maxDiameter = Math.round(asteroid.estimated_diameter.meters.estimated_diameter_max);
                    const closeApproach = asteroid.close_approach_data[0];
                    const missDistanceKm = Math.round(closeApproach.miss_distance.kilometers).toLocaleString();
                    const velocityKmH = Math.round(closeApproach.relative_velocity.kilometers_per_hour).toLocaleString();

                    const card = document.createElement('div');
                    card.className = `card ${isHazardous ? 'hazardous' : ''}`;

                    card.innerHTML = `
                        <h3>${asteroid.name}</h3>
                        <span class="badge ${isHazardous ? 'danger' : 'safe'}">
                            ${isHazardous ? '⚠️ 잠재적 위험' : '✅ 안전함'}
                        </span>
                        <div class="info-item"><strong>추정 지름:</strong> ${minDiameter}m ~ ${maxDiameter}m</div>
                        <div class="info-item"><strong>지구 접근 거리:</strong> 약 ${missDistanceKm} km</div>
                        <div class="info-item"><strong>이동 속도:</strong> 시속 ${velocityKmH} km/h</div>
                    `;

                    resultsDiv.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                statusDiv.textContent = '데이터를 가져오는 도중 오류가 발생했습니다. API 키를 확인해 주세요.';
            }
        }
    </script>
</body>
</html>
